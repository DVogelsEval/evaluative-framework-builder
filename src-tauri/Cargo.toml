[package]
name = "evaluative-framework-builder"
version = "0.0.1"
description = "Evaluative Framework Builder — plan an explicit evaluative framework, locally."
authors = ["Evaluative Framework Builder contributors"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop and (future) mobile entry points both call.
[lib]
name = "evaluative_framework_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Bundled by the CLI on `tauri dev`/`tauri build`; no custom cargo features.
default = []
