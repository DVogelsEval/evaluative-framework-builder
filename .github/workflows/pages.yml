name: Deploy to GitHub Pages

# The primary artefact (Arch §7): the offline-capable PWA, built and deployed
# to GitHub Pages on every push to main. Requires a one-time manual step in
# GitHub: Settings → Pages → Build and deployment → Source → "GitHub Actions".
# Until that's set, this workflow runs and builds but the deploy step is a
# no-op until Pages is enabled that way.
on:
  push:
    branches: [main]
  # Lets you trigger a redeploy by hand from the Actions tab without a new push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
